name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Prove installed factory
        run: node packages/factory/scripts/installed-e2e.mjs "$RUNNER_TEMP/factory-installed-proof"
      - name: Save installed proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: factory-installed-proof-${{ github.sha }}
          path: ${{ runner.temp }}/factory-installed-proof
          include-hidden-files: true
          if-no-files-found: warn
