name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # Test files run one at a time inside a job (maxWorkers: 1). The two slowest files get their own job;
  # the rest job excludes exactly those two, so every test file runs in exactly one job.
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            args: packages/cli/test/Cli.test.ts
          - name: factory-workflow
            args: packages/factory/test/Workflow.test.ts
          - name: rest
            args: --exclude '**/Cli.test.ts' --exclude '**/Workflow.test.ts'
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run ${{ matrix.args }}

  installed-proof:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prove real-provider evidence is safe with a fixture
        run: node packages/factory/scripts/real-journey-e2e.mjs "$RUNNER_TEMP/real-journey-fixture"
      - name: Prove installed factory
        env:
          AGENTRUN_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          AGENTRUN_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: node packages/factory/scripts/installed-e2e.mjs "$RUNNER_TEMP/factory-installed-proof"
      - name: Archive installed proof
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/factory-installed-proof" ]; then
            tar -czf "$RUNNER_TEMP/factory-installed-proof.tar.gz" -C "$RUNNER_TEMP" factory-installed-proof
          fi
      - name: Save installed proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: factory-installed-proof-${{ github.sha }}
          path: ${{ runner.temp }}/factory-installed-proof.tar.gz
          if-no-files-found: warn

  container-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PATH: /usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Install and build trusted factory
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          /usr/bin/sudo /usr/bin/ln -sf /opt/hostedtoolcache/node/24.21.0/x64/bin/node /usr/bin/node
          /home/runner/setup-pnpm/node_modules/.bin/pnpm install --frozen-lockfile
          /home/runner/setup-pnpm/node_modules/.bin/pnpm -r build
      - name: Build agent image
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          /usr/bin/docker build --file packages/factory/scripts/journey.Dockerfile --tag agentrun-journey:local .
      - name: Prove each container boundary red and green
        env:
          AGENTRUN_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          /usr/bin/python3 -I packages/factory/scripts/real-journey-separated-e2e.py "$RUNNER_TEMP/container-proof"
      - name: Stop owned containers before saving evidence
        if: ${{ always() }}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          /usr/bin/python3 -I packages/factory/scripts/stop-journey-containers.py
      - name: Save fixture proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: container-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/container-proof/results.json
            ${{ runner.temp }}/container-proof/target.json
            ${{ runner.temp }}/container-proof/journey/*.log
            ${{ runner.temp }}/container-proof/journey/*/*.json
            ${{ runner.temp }}/container-proof/journey/*/*.txt
          if-no-files-found: error
