name: Real provider journey

on:
  workflow_dispatch:
    inputs:
      example:
        description: Example directory under examples/factory
        type: string
        default: notes-ts
      budget:
        description: Provider budget in USD
        type: string
        default: "4"

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    environment: real-provider
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare unprivileged agent
        run: bash packages/factory/scripts/prepare-journey-user.sh
      - name: Run journey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXAMPLE: ${{ inputs.example }}
          BUDGET: ${{ inputs.budget }}
        run: |
          [[ "$EXAMPLE" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid example'; exit 2; }
          [[ "$BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid budget'; exit 2; }
          bash packages/factory/scripts/real-journey.sh --factory "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/real-journey" --id "real-$GITHUB_RUN_ID" \
            --example "examples/factory/$EXAMPLE" --budget "$BUDGET" --agent-user agentrun-agent
      - name: Stop agent processes before publication
        id: stopped
        if: ${{ always() }}
        run: |
          sudo pkill -KILL -u agentrun-agent || test "$?" -eq 1
          status=0
          pgrep -u agentrun-agent > /dev/null || status=$?
          test "$status" -eq 1
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Scan public evidence
        id: evidence
        if: ${{ always() && steps.stopped.outputs.safe == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 packages/factory/scripts/journey-evidence.py summary "$RUNNER_TEMP/real-journey" >> "$GITHUB_STEP_SUMMARY"
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Save public evidence
        if: ${{ always() && steps.evidence.outputs.safe == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: real-journey-${{ github.run_id }}
          path: ${{ runner.temp }}/real-journey/
          if-no-files-found: error
